name: Build Windows Installer

# Builds a Windows installer (MSI + NSIS) for testing on the user's fork.
# Triggers automatically on push to main and can also be run manually.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-installer:
    name: Windows installer
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - name: Install LLVM (libclang for bindgen + clang-cl for koharu-torch-sys)
        id: llvm
        uses: KyleMayes/install-llvm-action@v2
        with:
          # Must be >= 19: koharu-torch-sys hardcodes clang-cl, and MSVC 2022's
          # STL (14.44) static-asserts `STL1000: expected Clang 19.0.0 or newer`.
          version: "19"

      - name: Export LIBCLANG_PATH
        shell: bash
        run: |
          # install-llvm-action writes LLVM_PATH (e.g. C:\Program Files\LLVM) to
          # $GITHUB_ENV on success. bindgen's clang-sys runs as a NATIVE Windows
          # process, so LIBCLANG_PATH must be a native Windows path (drive letter
          # + slashes), NOT the MSYS "/c/..." form that bash uses — the native
          # process cannot resolve "/c/Program Files/LLVM/bin" (seen as invalid: []).
          LLVM_ROOT="${LLVM_PATH:-C:\\Program Files\\LLVM}"
          candidates=(
            "$LLVM_ROOT/bin"
            "C:/Program Files/LLVM/bin"
            "C:/Program Files/LLVM/lib"
            "C:/Program Files (x86)/LLVM/bin"
            "C:/LLVM/bin"
          )
          LIBCLANG_PATH=""
          for d in "${candidates[@]}"; do
            [ -z "$d" ] && continue
            if [ -f "$d/libclang.dll" ] || [ -f "$d/clang.dll" ]; then
              LIBCLANG_PATH="$d"
              break
            fi
          done
          if [ -z "$LIBCLANG_PATH" ]; then
            echo "::error::libclang.dll not found in candidate paths"
            echo "::group::LLVM dir listing (C:\\Program Files\\LLVM)"
            ls -la "/c/Program Files/LLVM" 2>/dev/null || true
            ls -la "/c/Program Files/LLVM/bin" 2>/dev/null | head -50 || true
            echo "::endgroup::"
            exit 1
          fi
          echo "LIBCLANG_PATH=$LIBCLANG_PATH" >> "$GITHUB_ENV"
          echo "libclang-path=$LIBCLANG_PATH" >> "$GITHUB_OUTPUT"
          echo "Resolved LIBCLANG_PATH=$LIBCLANG_PATH"

      - uses: oven-sh/setup-bun@v2

      - uses: Swatinem/rust-cache@v2

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@master
        with:
          cuda: '13.0.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "crt", "thrust", "nvvm", "cublas", "cublas_dev", "cufft", "cufft_dev", "curand", "curand_dev", "nvrtc", "nvrtc_dev"]'

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}

      - name: Install dependencies
        run: bun install

      - name: Build Windows installer
        run: bun tauri build
        env:
          LIBCLANG_PATH: ${{ env.LIBCLANG_PATH }}

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: koharu-windows-installer
          path: |
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
          retention-days: 14
